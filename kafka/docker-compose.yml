# Arquitectura orientada a EVENTOS con Apache Kafka
# Levantar:  docker compose up -d --build
# Escalar:   docker compose up -d --scale inventory-consumer=2
# Consumidor tardío (CP-11):  docker compose --profile tardio up -d audit-consumer
name: arq-kafka

services:
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: kafka
    hostname: kafka
    ports:
      - "29092:29092"   # acceso desde la máquina anfitriona (scripts de prueba)
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka-data:/bitnami/kafka   # el log de eventos y los offsets sobreviven a reinicios (CP-12)
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  orders-api:
    build: ./orders-api
    container_name: orders-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - KAFKA_BROKER=kafka:9092      # nunca localhost dentro de un contenedor
      - KAFKA_TOPIC=orders.events
      - TOPIC_PARTITIONS=3
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Consumidores: sin container_name ni ports (se pueden escalar y no reciben HTTP)
  inventory-consumer:
    build: ./inventory-consumer
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=orders.events
      - KAFKA_GROUP_ID=inventory-service-group
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  billing-consumer:
    build: ./billing-consumer
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=orders.events
      - KAFKA_GROUP_ID=billing-service-group
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  notification-consumer:
    build: ./notification-consumer
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=orders.events
      - KAFKA_GROUP_ID=notification-service-group
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Consumidor TARDÍO (CP-11): un grupo nuevo que arranca después de publicar
  # y lee los eventos desde el inicio del log. Solo se levanta con --profile tardio.
  audit-consumer:
    build: ./notification-consumer
    profiles: ["tardio"]
    environment:
      - CONSUMER_NAME=audit-consumer
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=orders.events
      - KAFKA_GROUP_ID=${AUDIT_GROUP_ID:-audit-service-group}
      - ACTION=Registrando el pedido en auditoría
      - PROCESS_MS=0
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
